model:
  name: nnunet
  display_name: nnU-Net v2
  family: self_configuring_cnn
  backend: nnunetv2
  adapter: segagent.models.nnunet.adapter
  spatial_dims: 3
  in_channels: 1
  out_channels: 2
  patch_size: [64, 64, 64]
  batch_size: 1
  mixed_precision: true
  initialization:
    strategy: scratch
    checkpoint: null
  architecture:
    dataset_id: 501
    configuration: 3d_fullres
    trainer: nnUNetTrainer_100epochs
    plans: nnUNetPlans
    folds: [0]
  checkpointing:
    root: checkpoints/stage1/nnunet
    monitor: val/dice
    mode: max
