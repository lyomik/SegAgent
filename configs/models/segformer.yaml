model:
  name: segformer
  display_name: SegFormer MiT-B0
  family: hierarchical_transformer
  backend: transformers
  adapter: segagent.models.segformer.adapter
  spatial_dims: 2
  in_channels: 1
  out_channels: 2
  patch_size: [256, 256]
  batch_size: 1
  mixed_precision: true
  initialization:
    strategy: imagenet_encoder
    checkpoint: checkpoints/pretrained/segformer
    input_adapter: repeat_grayscale_to_rgb
  architecture:
    variant: mit-b0
    upsample_logits: true
  checkpointing:
    root: checkpoints/stage1/segformer
    monitor: val/dice
    mode: max
