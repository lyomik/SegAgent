model:
  name: mednext
  display_name: MedNeXt-S
  family: modern_cnn
  backend: monai
  adapter: segagent.models.mednext.adapter
  spatial_dims: 3
  in_channels: 1
  out_channels: 2
  patch_size: [64, 64, 64]
  batch_size: 1
  mixed_precision: true
  initialization:
    strategy: scratch
    checkpoint: null
  architecture:
    variant: S
    kernel_size: 3
    deep_supervision: false
  checkpointing:
    root: checkpoints/stage1/mednext
    monitor: val/dice
    mode: max
