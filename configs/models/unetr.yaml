model:
  name: unetr
  display_name: UNETR
  family: transformer_cnn_hybrid
  backend: monai
  adapter: segagent.models.unetr.adapter
  spatial_dims: 3
  in_channels: 1
  out_channels: 2
  patch_size: [64, 64, 64]
  batch_size: 1
  mixed_precision: true
  initialization:
    strategy: scratch
    checkpoint: null
  architecture:
    feature_size: 16
    hidden_size: 768
    mlp_dim: 3072
    num_heads: 12
    proj_type: conv
    norm_name: instance
    conv_block: true
    res_block: true
    dropout_rate: 0.0
  checkpointing:
    root: checkpoints/stage1/unetr
    monitor: val/dice
    mode: max
