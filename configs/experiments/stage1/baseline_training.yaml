training:
  seed: 42
  epochs: 100
  steps_per_epoch: 128
  learning_rate: 0.0001
  weight_decay: 0.00001
  max_gradient_norm: 1.0
  loss:
    cross_entropy_weight: 0.5
    dice_weight: 0.5
  positive_patch_probability: 0.8
  augmentation:
    random_flip_probability: 0.5
  validation:
    cases_per_epoch: 32
  checkpoint_monitor: val_dice
  checkpoint_mode: max
