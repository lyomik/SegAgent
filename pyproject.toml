[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "segagent"
version = "0.1.0"
description = "Reproducible lung-nodule segmentation experiments on LIDC-IDRI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "nibabel>=5.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "pydicom>=2.4",
  "PyYAML>=6.0",
  "requests>=2.31",
  "scipy>=1.12",
  "SimpleITK>=2.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
  "monai>=1.3",
  "torch>=2.2",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
